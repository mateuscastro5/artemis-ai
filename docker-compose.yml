services:

  # ─── Banco Vetorial ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Serviço de IA (FastAPI + RAG) ───────────────────────────────────────
  artemis-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ─── Backend (NestJS) ─────────────────────────────────────────────────────
  artemis-api:
    build:
      context: ../artemis-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../artemis-api/.env
    environment:
      - AI_SERVICE_URL=http://artemis-ai:8000
    depends_on:
      artemis-ai:
        condition: service_healthy
    volumes:
      - ../artemis-api:/app
      - api_node_modules:/app/node_modules
    restart: unless-stopped

  # ─── Frontend (React via Vite) ────────────────────────────────────────────
  artemis-front:
    build:
      context: ../artemis-front
      dockerfile: Dockerfile
    ports:
      - "5123:5123"
    depends_on:
      - artemis-api
    volumes:
      - ../artemis-front:/app
      - front_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  qdrant_data:
  api_node_modules:
  front_node_modules:
