[project]
name = "perform-ai"
version = "0.1.0"
description = "PERFORM AI Analysis Service - Dual-LLM + RAG pipeline for PR complexity scoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "qdrant-client>=1.12",
    "openai>=1.50",
    "voyageai>=0.3",
    "mem0ai>=0.1.40",
    "tenacity>=8.5",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
